name: deploy

# Publishes the site to GitHub Pages (ux.sgit.ai) from dev, the default branch, only after the gate passes.
# Requires Settings → Pages → Source: "GitHub Actions", with the custom domain set to ux.sgit.ai.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents : read
  pages    : write
  id-token : write

concurrency:
  group              : pages
  cancel-in-progress : false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name : github-pages
      url  : ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release gate
        run: python3 admin/build/gate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
